<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一鍵報價工具 | 胖爸省工坊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2937;
      --brand: #d97706;
      --brand-dark: #b45309;
      --brand-light: #fef3c7;
      --green: #059669;
      --green-light: #d1fae5;
      --red: #dc2626;
      --red-light: #fee2e2;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--white);
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: .04em;
    }
    header span {
      font-size: 14px;
      color: var(--gray-400);
    }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, #fffbeb 0%, #fff 60%);
      border-bottom: 1px solid var(--gray-200);
      padding: 48px 24px 40px;
      text-align: center;
    }
    .hero-tag {
      display: inline-block;
      background: var(--brand-light);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 16px;
      letter-spacing: .04em;
    }
    .hero h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--brand);
    }
    .hero p {
      font-size: 16px;
      color: var(--gray-600);
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }
    .hero-image {
      max-width: 320px;
      width: 100%;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      margin: 0 auto;
      display: block;
    }

    /* ── Steps ── */
    .steps {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 0 auto;
      max-width: 560px;
      padding: 32px 24px;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--gray-200);
    }
    .step-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      margin-bottom: 8px;
    }
    .step span {
      font-size: 12px;
      color: var(--gray-600);
      text-align: center;
      line-height: 1.4;
    }

    /* ── Main container ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px 64px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-400);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    /* ── Form ── */
    .form-row {
      display: grid;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 6px;
    }
    .field label .req {
      color: var(--brand);
      margin-left: 2px;
    }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--gray-800);
      background: var(--white);
      transition: border-color .15s;
      outline: none;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(217,119,6,.12);
    }
    .field textarea { resize: vertical; min-height: 80px; }

    /* ── Items table ── */
    .items-header {
      display: grid;
      grid-template-columns: 1fr 72px 96px 80px 36px;
      gap: 8px;
      padding: 0 4px 8px;
      border-bottom: 1px solid var(--gray-200);
      margin-bottom: 8px;
    }
    .items-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-400);
    }
    .item-row {
      display: grid;
      grid-template-columns: 1fr 72px 96px 80px 36px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .item-row input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--gray-800);
      background: var(--white);
      outline: none;
      transition: border-color .15s;
    }
    .item-row input:focus { border-color: var(--brand); }
    .item-row input[readonly] {
      background: var(--gray-50);
      color: var(--gray-600);
    }
    .btn-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-400);
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      transition: color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-remove:hover { color: var(--red); }

    .items-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--gray-200);
      margin-top: 8px;
    }
    .btn-add {
      background: none;
      border: 1.5px dashed var(--gray-200);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      color: var(--gray-600);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .total-display {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-800);
    }
    .total-display span {
      color: var(--brand);
      font-size: 20px;
    }

    /* ── Submit ── */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .btn-submit:hover:not(:disabled) { background: var(--brand-dark); }
    .btn-submit:active:not(:disabled) { transform: scale(.98); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    .hint-text {
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 12px;
    }

    /* ── Status messages ── */
    .status-box {
      display: none;
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 16px;
      text-align: center;
    }
    .status-box.success {
      background: var(--green-light);
      border: 1px solid #6ee7b7;
    }
    .status-box.error {
      background: var(--red-light);
      border: 1px solid #fca5a5;
    }
    .status-icon { font-size: 32px; margin-bottom: 8px; }
    .status-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .status-msg { font-size: 14px; color: var(--gray-600); }
    .status-box.success .status-title { color: var(--green); }
    .status-box.error .status-title { color: var(--red); }

    /* ── Loading spinner ── */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .form-row.cols-2 { grid-template-columns: 1fr; }
      .items-header { grid-template-columns: 1fr 60px 80px 70px 28px; }
      .item-row { grid-template-columns: 1fr 60px 80px 70px 28px; }
      .card { padding: 20px 16px; }
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--gray-400);
      border-top: 1px solid var(--gray-100);
    }
    footer a { color: var(--brand); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="logo-badge">胖爸省工坊</div>
  <span>作品示範 #3</span>
</header>

<div class="hero">
  <div class="hero-tag">自動化工具示範</div>
  <h1>報價單<em>自動產生</em>，<br>填好就寄出</h1>
  <p>填入客戶資訊與服務項目，系統自動產出 PDF 報價單並寄到指定信箱，省去手動排版的時間。</p>
  <img class="hero-image" src="assets/hero.png" alt="自動報價工具示意">
</div>

<div class="steps">
  <div class="step">
    <div class="step-dot">1</div>
    <span>填入<br>基本資訊</span>
  </div>
  <div class="step">
    <div class="step-dot">2</div>
    <span>新增<br>服務項目</span>
  </div>
  <div class="step">
    <div class="step-dot">3</div>
    <span>按下送出<br>自動寄信</span>
  </div>
</div>

<div class="container">

  <form id="quoteForm">

    <!-- 基本資訊 -->
    <div class="card">
      <div class="section-title">基本資訊</div>
      <div class="form-row cols-2">
        <div class="field">
          <label>客戶姓名 / 公司<span class="req">*</span></label>
          <input type="text" id="clientName" placeholder="例：王小明 / 星光設計有限公司" required>
        </div>
        <div class="field">
          <label>報價日期</label>
          <input type="date" id="quoteDate" readonly>
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="field">
          <label>寄送 Email<span class="req">*</span></label>
          <input type="email" id="clientEmail" placeholder="client@example.com" required>
        </div>
        <div class="field">
          <label>報價單編號</label>
          <input type="text" id="quoteNo" readonly placeholder="系統自動產生">
        </div>
      </div>
    </div>

    <!-- 服務項目 -->
    <div class="card">
      <div class="section-title">服務項目</div>
      <div class="items-header">
        <span>項目名稱</span>
        <span>數量</span>
        <span>單價（元）</span>
        <span>小計</span>
        <span></span>
      </div>
      <div id="itemsContainer"></div>
      <div class="items-footer">
        <button type="button" class="btn-add" onclick="addItem()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          新增項目
        </button>
        <div class="total-display">
          合計：<span id="totalDisplay">$0</span>
        </div>
      </div>
    </div>

    <!-- 備注 -->
    <div class="card">
      <div class="section-title">備注（選填）</div>
      <div class="field">
        <textarea id="notes" placeholder="付款方式、有效期限、特別說明…"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <div class="spinner" id="spinner"></div>
      <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      產出 PDF 並寄送報價單
    </button>
    <p class="hint-text">報價單將以 PDF 附件寄至您填入的 Email，通常在 30 秒內送達</p>

    <div class="status-box success" id="successBox">
      <div class="status-icon">✓</div>
      <div class="status-title">報價單已成功寄出！</div>
      <div class="status-msg" id="successMsg">PDF 已寄到指定信箱，請查收。</div>
    </div>

    <div class="status-box error" id="errorBox">
      <div class="status-icon">!</div>
      <div class="status-title">寄送失敗</div>
      <div class="status-msg" id="errorMsg">請稍後再試，或聯絡胖爸省工坊。</div>
    </div>

  </form>
</div>

<footer>
  此工具為 <a href="https://pandad-workshop.vercel.app" target="_blank">胖爸省工坊</a> 示範作品 #3 &mdash; 報價單自動化
</footer>

<script>
  // ── 初始化 ──
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXxX2Q2i_XWU33eG902eUpuks2Cnuh-3s80Y0rMYh2BaXdRcbdWaEO2wt3zM-AD2tZ/exec';

  function pad(n) { return String(n).padStart(2, '0'); }

  function initDefaults() {
    const today = new Date();
    const dateStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    document.getElementById('quoteDate').value = dateStr;

    const seq = String(Math.floor(Math.random() * 900) + 100);
    const ym = `${today.getFullYear()}${pad(today.getMonth()+1)}`;
    document.getElementById('quoteNo').value = `QT-${ym}-${seq}`;

    // 預設兩個空白項目
    addItem();
    addItem();
  }

  // ── 動態新增項目 ──
  let itemCount = 0;

  function addItem(name='', qty=1, price='') {
    itemCount++;
    const id = itemCount;
    const container = document.getElementById('itemsContainer');
    const row = document.createElement('div');
    row.className = 'item-row';
    row.id = `item-${id}`;
    row.innerHTML = `
      <input type="text" placeholder="例：網站設計" value="${name}" oninput="calcRow(${id})">
      <input type="number" min="1" value="${qty}" oninput="calcRow(${id})">
      <input type="number" min="0" placeholder="0" value="${price}" oninput="calcRow(${id})">
      <input type="text" id="subtotal-${id}" readonly placeholder="$0">
      <button type="button" class="btn-remove" onclick="removeItem(${id})" title="刪除">&#x2715;</button>
    `;
    container.appendChild(row);
    calcRow(id);
  }

  function removeItem(id) {
    const row = document.getElementById(`item-${id}`);
    if (row) row.remove();
    calcTotal();
  }

  function calcRow(id) {
    const row = document.getElementById(`item-${id}`);
    if (!row) return;
    const inputs = row.querySelectorAll('input');
    const qty = parseFloat(inputs[1].value) || 0;
    const price = parseFloat(inputs[2].value) || 0;
    const sub = qty * price;
    inputs[3].value = sub > 0 ? `$${sub.toLocaleString()}` : '';
    calcTotal();
  }

  function calcTotal() {
    let total = 0;
    document.querySelectorAll('.item-row').forEach(row => {
      const inputs = row.querySelectorAll('input');
      const qty = parseFloat(inputs[1].value) || 0;
      const price = parseFloat(inputs[2].value) || 0;
      total += qty * price;
    });
    document.getElementById('totalDisplay').textContent = `$${total.toLocaleString()}`;
    return total;
  }

  function getItems() {
    const items = [];
    document.querySelectorAll('.item-row').forEach(row => {
      const inputs = row.querySelectorAll('input');
      const name = inputs[0].value.trim();
      const qty = parseFloat(inputs[1].value) || 0;
      const price = parseFloat(inputs[2].value) || 0;
      if (name || price > 0) {
        items.push({ name: name || '(未命名)', qty, price, subtotal: qty * price });
      }
    });
    return items;
  }

  // ── 表單送出 ──
  document.getElementById('quoteForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const items = getItems();
    if (items.length === 0) {
      alert('請至少填入一個服務項目。');
      return;
    }

    const payload = {
      clientName: document.getElementById('clientName').value.trim(),
      clientEmail: document.getElementById('clientEmail').value.trim(),
      quoteDate: document.getElementById('quoteDate').value,
      quoteNo: document.getElementById('quoteNo').value,
      notes: document.getElementById('notes').value.trim(),
      items,
      total: calcTotal()
    };

    // UI: loading
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('sendIcon').style.display = 'none';
    document.getElementById('successBox').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('successMsg').textContent =
          `PDF 已寄到 ${payload.clientEmail}，請查收。`;
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('successBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        throw new Error(result.error || '未知錯誤');
      }
    } catch (err) {
      document.getElementById('errorMsg').textContent = `錯誤：${err.message}`;
      document.getElementById('errorBox').style.display = 'block';
    } finally {
      btn.disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('sendIcon').style.display = 'block';
    }
  });

  initDefaults();
</script>
</body>
</html>
